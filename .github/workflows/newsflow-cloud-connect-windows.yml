name: NewsFlow PR35 Explainer Review Safety Windows

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Full native verification or only the historical failure comparison'
        type: choice
        options: [full, history, flow, visual-assets, transition]
        default: full
  push:
    branches: [codex/newsflow-ux-video-app]
    paths: ['newsflow-ai/src/**', 'newsflow-ai/tests/**', 'newsflow-ai/tools/**', 'newsflow-ai/run.bat', 'newsflow-ai/requirements-dev.lock', '.github/workflows/newsflow-cloud-connect-windows.yml']

permissions:
  contents: read

jobs:
  connected-workspace:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14.7']
    env:
      PYTHONUTF8: '1'
      NEWSFLOW_LIVE_TEST: '0'
      NEWSFLOW_AI_LIVE_TEST: '0'
      NEWSFLOW_AI_API_KEY: ''
      NEWSFLOW_CLAUDE_API_KEY: ''
      NEWSFLOW_ANTHROPIC_API_KEY: ''
      NEWSFLOW_VIDEO_AI_KEY: ''
      NEWSFLOW_ELEVENLABS_KEY: ''
      NEWSFLOW_META_APP_SECRET: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      CLAUDE_CODE_OAUTH_TOKEN: ''
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact approved Python version
        run: python -c "import sys; assert sys.version_info[:3] == (3, 14, 7), sys.version; print(sys.version)"
      - name: Pinned dependencies and pip check
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install -r requirements-dev.lock -r tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare existing video and Chrome prerequisites
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH += ';C:\ProgramData\chocolatey\bin;C:\tools\ffmpeg\bin'
          }
          @((Split-Path (Get-Command ffmpeg -ErrorAction Stop).Source), (Split-Path (Get-Command ffprobe -ErrorAction Stop).Source)) | Select-Object -Unique | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $fontPath = 'C:\Windows\Fonts\malgun.ttf'
          if (-not (Test-Path -LiteralPath $fontPath)) { throw 'Korean font missing' }
          "NEWSFLOW_FONT_PATH=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEWSFLOW_VALIDATION_OUTPUT=$env:RUNNER_TEMP/newsflow-connect-evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEWSFLOW_DATA_DIR=$env:RUNNER_TEMP/newsflow-connect-default" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          if (-not ($chrome | Where-Object { Test-Path -LiteralPath $_ })) { throw 'Windows Chrome missing' }
      - name: Register current synthetic profile and worker ownership fixture
        run: |
          $ciSupport = Join-Path $env:RUNNER_TEMP 'newsflow-current-fixtures'
          New-Item -ItemType Directory -Force $ciSupport | Out-Null
          @'
          """Current per-test profile ownership for disposable Windows Actions only.
          
          This complements claude_compat_safety; it never replaces or disables its guard.
          """
          import json
          import os
          import threading
          import time
          from pathlib import Path
          
          import pytest
          
          CLEANUP = []
          
          
          @pytest.fixture(autouse=True)
          def step13_isolation(monkeypatch, tmp_path):
              for name in (
                  "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN",
                  "CLAUDE_CODE_OAUTH_TOKEN", "NEWSFLOW_AI_API_KEY", "NEWSFLOW_ANTHROPIC_API_KEY",
                  "NEWSFLOW_VIDEO_AI_KEY", "NEWSFLOW_ELEVENLABS_KEY", "NEWSFLOW_META_APP_SECRET",
                  "HF_KEY", "HF_API_KEY", "HF_API_SECRET",
              ):
                  assert not os.environ.get(name), "Unexpected provider credential in disposable CI"
              for name in ("TEMP", "TMP", "LOCALAPPDATA", "APPDATA", "NEWSFLOW_DATA_DIR"):
                  target = tmp_path / "ci-profile" / name.lower()
                  target.mkdir(parents=True)
                  monkeypatch.setenv(name, str(target))
          
              from newsflow import main
          
              apps = []
              baseline = set(threading.enumerate())
              original = main.FastAPI
          
              def tracked_app(*args, **kwargs):
                  app = original(*args, **kwargs)
                  apps.append(app)
                  return app
          
              monkeypatch.setattr(main, "FastAPI", tracked_app)
              try:
                  yield
              finally:
                  for app in reversed(apps):
                      for name in (
                          "scheduler", "publishing_calendar", "video_ai", "autopilot",
                          "autopilot_backend", "youtube", "tiktok", "instagram", "coordinator", "video",
                      ):
                          owner = getattr(app.state, name, None)
                          close = getattr(owner, "close", None)
                          if callable(close):
                              close()
                      engine = getattr(app.state, "engine", None)
                      if engine is not None:
                          engine.dispose()
                  deadline = time.monotonic() + 3
                  remaining = []
                  while time.monotonic() < deadline:
                      remaining = [t for t in threading.enumerate() if t not in baseline and t.is_alive()]
                      if not remaining:
                          break
                      for thread in remaining:
                          thread.join(timeout=0.05)
                  CLEANUP.append({"apps": len(apps), "remaining_threads": len(remaining)})
                  assert not remaining, "CI synthetic fixture left live threads"
          
          
          def pytest_sessionfinish(session, exitstatus):
              output = Path(session.config.getoption("basetemp")) / "fixture-cleanup-safe.json"
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps({
                  "tests": len(CLEANUP),
                  "tests_with_remaining_threads": sum(bool(x["remaining_threads"]) for x in CLEANUP),
                  "tracked_apps": sum(x["apps"] for x in CLEANUP),
                  "real_keys_loaded": False,
                  "isolation_guard": "claude_compat_safety remains enabled",
              }), encoding="utf-8")
          '@ | Set-Content -LiteralPath (Join-Path $ciSupport 'ci_current_isolation.py') -Encoding utf8
          "PYTHONPATH=$PWD/src;$PWD/tests;$ciSupport" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .venv/Scripts/python -m ruff check (Join-Path $ciSupport 'ci_current_isolation.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ruff
        run: |
          .venv/Scripts/python -m ruff check src tests tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Explainer review and existing history safeguards - Fake providers
        run: |
          $env:PYTHONPATH = "$PWD/src;$PWD/tests;$env:RUNNER_TEMP/newsflow-current-fixtures"
          New-Item -ItemType Directory -Path validation-output -Force | Out-Null
          $testOptions = @('-p', 'claude_compat_safety', '-p', 'ci_current_isolation', '--basetemp=validation-output/explainer-compat-ci')
          $targets = @(Get-Content tools/explainer_review_targets.txt | Where-Object { $_ -and -not $_.StartsWith('#') })
          Write-Host "Changed-range targets: $($targets -join ' ')"
          .venv/Scripts/python -m pytest -q -rs @testOptions @targets --junitxml=validation-output/final-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload synthetic summaries and key screens only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr35-explainer-review-safety-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/newsflow-connect-evidence/**/*.json
            ${{ runner.temp }}/newsflow-connect-evidence/**/*.png
            newsflow-ai/validation-output/final-tests.xml
            newsflow-ai/validation-output/explainer-compat-ci/**/screens/*.png
          if-no-files-found: warn
          retention-days: 14
      # No real service keys, OAuth, media transfer or operation on user data.
      # Native DPAPI uses synthetic values; no MP4/WAV/SQLite/key artifacts are uploaded.

  final-windows-ui:
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'flow' && inputs.scope != 'visual-assets' && inputs.scope != 'transition'
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14.7']
    env:
      PYTHONUTF8: '1'
      NEWSFLOW_LIVE_TEST: '0'
      NEWSFLOW_AI_LIVE_TEST: '0'
      NEWSFLOW_AI_API_KEY: ''
      NEWSFLOW_CLAUDE_API_KEY: ''
      NEWSFLOW_ANTHROPIC_API_KEY: ''
      NEWSFLOW_VIDEO_AI_KEY: ''
      NEWSFLOW_ELEVENLABS_KEY: ''
      NEWSFLOW_META_APP_SECRET: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      CLAUDE_CODE_OAUTH_TOKEN: ''
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact approved Python version
        run: python -c "import sys; assert sys.version_info[:3] == (3, 14, 7), sys.version; print(sys.version)"
      - name: Pinned dependencies and pip check
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install -r requirements-dev.lock -r tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare existing video and Chrome prerequisites
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH += ';C:\ProgramData\chocolatey\bin;C:\tools\ffmpeg\bin'
          }
          @((Split-Path (Get-Command ffmpeg -ErrorAction Stop).Source), (Split-Path (Get-Command ffprobe -ErrorAction Stop).Source)) | Select-Object -Unique | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $fontPath = 'C:\Windows\Fonts\malgun.ttf'
          if (-not (Test-Path -LiteralPath $fontPath)) { throw 'Korean font missing' }
          "NEWSFLOW_FONT_PATH=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEWSFLOW_VALIDATION_OUTPUT=$env:RUNNER_TEMP/newsflow-final-ui" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEWSFLOW_DATA_DIR=$env:RUNNER_TEMP/newsflow-final-ui-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          if (-not ($chrome | Where-Object { Test-Path -LiteralPath $_ })) { throw 'Windows Chrome missing' }
      - name: Isolate native profile and record exact product version
        run: |
          "LOCALAPPDATA=$env:RUNNER_TEMP/newsflow-final-ui-profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$PWD/src;$PWD/tests;$PWD/tools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/newsflow-final-ui" | Out-Null
          git rev-parse HEAD
          python --version
      - name: Scoped regression and historical 57 IDs versus accepted baseline
        id: comparison
        continue-on-error: true
        run: |
          $options = @('--output', "$env:RUNNER_TEMP/newsflow-final-ui/comparison")
          if ('${{ inputs.scope }}' -eq 'history') { $options += '--historical-only' }
          .venv/Scripts/python tools/ci_final_windows_ui.py @options
          exit $LASTEXITCODE
      - name: Native DPAPI with disposable synthetic credentials
        if: always() && steps.comparison.outcome != 'skipped' && inputs.scope != 'history'
        id: vault
        continue-on-error: true
        run: .venv/Scripts/python tools/ci_vault_validation.py --output "$env:RUNNER_TEMP/newsflow-final-ui/vault.json"
      - name: Actual BAT start duplicate shutdown and restart
        if: always() && steps.comparison.outcome != 'skipped' && inputs.scope != 'history'
        id: bat
        continue-on-error: true
        timeout-minutes: 6
        run: .venv/Scripts/python tools/ci_windows_launch_smoke.py --root "$env:TEMP/newsflow-final-ui-bat" --output "$env:RUNNER_TEMP/newsflow-final-ui/bat.json"
      - name: Windows Chrome final screens and supplied artwork
        if: always() && steps.comparison.outcome != 'skipped' && inputs.scope != 'history'
        id: browser
        continue-on-error: true
        run: |
          $env:UX_PHASE = 'after'
          $env:UX_EVIDENCE = "$env:RUNNER_TEMP/newsflow-final-ui/screens"
          .venv/Scripts/python -m pytest -q -rs tools/test_windows_final_visual.py --junitxml="$env:RUNNER_TEMP/newsflow-final-ui/browser.xml"
          exit $LASTEXITCODE
      - name: Fake news and AI to actual MP4 and review and Fake publishing
        if: always() && steps.comparison.outcome != 'skipped' && inputs.scope != 'history'
        id: flow
        continue-on-error: true
        run: |
          .venv/Scripts/python -m pytest -q -rs tools/test_windows_final_flow.py --junitxml="$env:RUNNER_TEMP/newsflow-final-ui/flow.xml"
          exit $LASTEXITCODE
      - name: Report actual step outcomes without treating failures as success
        if: always()
        run: |
          $results = @{ comparison='${{ steps.comparison.outcome }}'; vault='${{ steps.vault.outcome }}'; bat='${{ steps.bat.outcome }}'; browser='${{ steps.browser.outcome }}'; flow='${{ steps.flow.outcome }}'; sha='${{ github.sha }}'; python='${{ matrix.python }}' }
          $results | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/newsflow-final-ui/outcomes.json" -Encoding utf8
          if ('${{ inputs.scope }}' -eq 'history') { if ($results.comparison -ne 'success') { exit 1 } }
          elseif (@($results.comparison,$results.vault,$results.bat,$results.browser,$results.flow) | Where-Object { $_ -ne 'success' }) { exit 1 }
      - name: Upload isolated evidence only never keys databases or MP4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr35-final-windows-ui-${{ matrix.python }}-${{ inputs.scope }}
          path: |
            ${{ runner.temp }}/newsflow-final-ui/**/*.json
            ${{ runner.temp }}/newsflow-final-ui/**/*.xml
            ${{ runner.temp }}/newsflow-final-ui/**/*.txt
            ${{ runner.temp }}/newsflow-final-ui/**/*.png
          if-no-files-found: warn
          retention-days: 14

