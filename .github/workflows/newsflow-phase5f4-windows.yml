name: NewsFlow Phase 5F.4 contract (no live Codex)
on:
  push:
    branches: [feat/newsflow-phase5f4]
    paths:
      - newsflow-ai/src/newsflow/research.py
      - newsflow-ai/tests/test_codex_research.py
      - .github/workflows/newsflow-phase5f4-windows.yml
permissions:
  contents: read
jobs:
  contract:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    defaults:
      run:
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolate runner packages
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $PWD '.venv/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check src/newsflow/research.py tests/test_codex_research.py
      - run: python -m pytest -q tests/test_codex_research.py
