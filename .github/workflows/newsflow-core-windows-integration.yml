name: NewsFlow core Windows route roundtrips
on:
  push:
    branches: [codex/newsflow-core-studios-rebuild-20261027]
    paths:
      - 'newsflow-ai/tools/studio_v3/integration/test_core_windows_roundtrip.py'
      - '.github/workflows/newsflow-core-windows-integration.yml'
permissions:
  contents: read
jobs:
  real-app-routes-synthetic-data:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Assemble unchanged React assets for real Python serving
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend exec vite build --configLoader runner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install isolated dependencies
        run: python -m pip install -e . pytest==8.4.2 httpx==0.28.1
      - name: Only new Windows application route roundtrips
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -rP -p no:cacheprovider --confcutdir tools/studio_v3/integration --basetemp "$env:RUNNER_TEMP/core-windows-roundtrips" --junitxml=core-windows-roundtrip.xml tools/studio_v3/integration/test_core_windows_roundtrip.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-windows-roundtrip-results
          path: newsflow-ai/core-windows-roundtrip.xml
