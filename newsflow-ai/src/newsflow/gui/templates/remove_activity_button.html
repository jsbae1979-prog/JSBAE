{% if task.can_remove %}<details class="cleanup-control"><summary title="최근 활동에서 삭제" aria-label="{{ task.title }} 활동 삭제">{{ ui_icon('trash',16) }} 삭제</summary><form data-cleanup-form method="post" action="/workspace/activity/remove"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="item" value="{{ task.id }}"><p>목록에서 삭제합니다. 대본·영상·사용량·실패 기록은 보존됩니다.</p><label><input type="checkbox" name="confirm" value="true" required> 이 활동을 목록에서 삭제</label><button type="submit">삭제 확인</button><p data-cleanup-error role="alert" class="error" hidden></p></form></details>{% endif %}
