[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "newsflow-ai"
version = "0.6.0b1"
description = "Windows news-to-video automation with real RSS, gated AI scripts, Korean voice and local review queue"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "jinja2>=3.1.5,<4", "SQLAlchemy>=2.0.36,<3", "alembic>=1.14,<2", "feedparser>=6.0.11,<7", "defusedxml>=0.7.1,<1", "python-multipart>=0.0.20,<1", "filelock>=3.16,<4", "pydantic>=2.10,<3", "Pillow>=11.3,<13"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
newsflow = "newsflow.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
newsflow = ["gui/templates/*.html", "static/css/*.css", "static/js/*.js", "db/migrations/*.py", "db/migrations/versions/*.py", "video/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: opt-in live RSS request"]

[tool.ruff]
target-version = "py312"
line-length = 110
