name: NewsFlow Windows validation

on:
  push:
    branches: [feat/newsflow-phase1]
    paths:
      - '.github/workflows/newsflow-windows.yml'
      - 'newsflow-ai/src/**'
      - 'newsflow-ai/tests/**'
      - 'newsflow-ai/tools/**'
      - 'newsflow-ai/run.bat'
      - 'newsflow-ai/pyproject.toml'
      - 'newsflow-ai/requirements-dev.lock'
      - 'newsflow-ai/.gitattributes'

permissions:
  contents: read

concurrency:
  group: newsflow-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    if: github.ref == 'refs/heads/feat/newsflow-phase1'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      NEWSFLOW_LIVE_TEST: '0'
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install development and browser dependencies
        run: |
          python -m pip install -r requirements-dev.lock -r tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: All offline regression tests
        run: |
          python -m pytest -q -rs --junitxml=validation-output/pytest.xml
          $testExit = $LASTEXITCODE
          python tools/ci_pytest_summary.py validation-output/pytest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($testExit -ne 0) { exit $testExit }
      - name: Actual BAT, default path, lifecycle, SQLite and GUI POST
        run: |
          python tools/ci_validation.py --mode windows --output validation-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload synthetic validation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: newsflow-windows-validation
          path: newsflow-ai/validation-output/
          if-no-files-found: warn
          retention-days: 7
