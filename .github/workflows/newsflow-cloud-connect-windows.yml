          git rev-parse HEAD
          python --version
      - name: Ruff
        run: .venv/Scripts/python -m ruff check tests/test_visual_asset_followup.py
      - name: News images and existing AI mode safety - no live services
        run: |
          .venv/Scripts/python -m pytest -q -rs -p windows_final_guard tests/test_visual_asset_followup.py tests/test_news_thumbnails.py tests/test_final_production.py --junitxml="$env:RUNNER_TEMP/newsflow-visual-assets/tests.xml"
          exit $LASTEXITCODE
      - name: Reproduce existing migration assertion on unchanged baseline
        if: always()
        run: |
          $baseline = "$env:RUNNER_TEMP/newsflow-visual-baseline"
          New-Item -ItemType Directory -Force $baseline | Out-Null
          git -C .. archive c5ed43ffd7140aeca0e7c2521882a06227905805 --output="$env:RUNNER_TEMP/newsflow-visual-baseline.tar" newsflow-ai/src newsflow-ai/tests newsflow-ai/pyproject.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -xf "$env:RUNNER_TEMP/newsflow-visual-baseline.tar" -C $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = "$baseline/newsflow-ai/src;$baseline/newsflow-ai/tests;$PWD/tools"
          .venv/Scripts/python -m pytest -q -rs -p windows_final_guard "$baseline/newsflow-ai/tests/test_news_thumbnails.py::test_additive_migration_preserves_synthetic_legacy_tables" --junitxml="$env:RUNNER_TEMP/newsflow-visual-assets/baseline.xml"
          exit $LASTEXITCODE
      - name: Record exact environment
        if: always()
        run: |
          @{ sha='${{ github.sha }}'; python='${{ matrix.python }}'; platform='Windows Chrome'; live_services='blocked by windows_final_guard'; scope='visual-assets' } | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/newsflow-visual-assets/environment.json" -Encoding utf8
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr35-visual-assets-${{ matrix.python }}
          path: ${{ runner.temp }}/newsflow-visual-assets/
          retention-days: 14
          if-no-files-found: warn

  transition:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'transition'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14.7']
    env:
      PYTHONUTF8: '1'
      NEWSFLOW_LIVE_TEST: '0'
      NEWSFLOW_AI_LIVE_TEST: '0'
      NEWSFLOW_AI_API_KEY: ''
      NEWSFLOW_CLAUDE_API_KEY: ''
      NEWSFLOW_ANTHROPIC_API_KEY: ''
      NEWSFLOW_VIDEO_AI_KEY: ''
      NEWSFLOW_ELEVENLABS_KEY: ''
      NEWSFLOW_META_APP_SECRET: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      CLAUDE_CODE_OAUTH_TOKEN: ''
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact approved Python version
        run: python -c "import sys; assert sys.version_info[:3] == (3, 14, 7), sys.version; print(sys.version)"
      - name: Pinned dependencies and pip check
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install -r requirements-dev.lock -r tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare isolated rehearsal and FFmpeg
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH += ';C:\ProgramData\chocolatey\bin;C:\tools\ffmpeg\bin'
          }
          @((Split-Path (Get-Command ffmpeg -ErrorAction Stop).Source), (Split-Path (Get-Command ffprobe -ErrorAction Stop).Source)) | Select-Object -Unique | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          "LOCALAPPDATA=$env:RUNNER_TEMP/newsflow-transition-profile" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "NEWSFLOW_DATA_DIR=$env:RUNNER_TEMP/newsflow-transition-data" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$PWD/src;$PWD/tests;$PWD/tools" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/newsflow-transition-evidence" | Out-Null
          git rev-parse HEAD
          python --version
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Ruff rehearsal tests
        run: .venv/Scripts/python -m ruff check tests/test_windows_transition_plan.py
      - name: Synthetic backup restore migration and native DPAPI
        id: rehearsal
        continue-on-error: true
        run: |
          .venv/Scripts/python -m pytest -q -rs -p windows_final_guard tests/test_windows_transition_plan.py tests/test_windows.py::test_install_failure_stops_marker_and_redacts tests/test_windows.py::test_server_socket_conflict_and_release tests/test_windows.py::test_invalid_secret_not_printed -o junit_family=legacy --junitxml="$env:RUNNER_TEMP/newsflow-transition-evidence/tests.xml"
          exit $LASTEXITCODE
      - name: Existing BAT start duplicate shutdown restart in disposable TEMP only
        id: bat
        if: always()
        continue-on-error: true
        timeout-minutes: 6
        run: .venv/Scripts/python tools/ci_windows_launch_smoke.py --root "$env:TEMP/newsflow-transition-bat" --output "$env:RUNNER_TEMP/newsflow-transition-evidence/bat.json"
      - name: Record outcomes without backup contents
        if: always()
        run: |
          @{ sha='${{ github.sha }}'; python='${{ matrix.python }}'; rehearsal='${{ steps.rehearsal.outcome }}'; bat='${{ steps.bat.outcome }}'; user_pc='NOT VERIFIED' } | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/newsflow-transition-evidence/outcomes.json" -Encoding utf8
          if ('${{ steps.rehearsal.outcome }}' -ne 'success' -or '${{ steps.bat.outcome }}' -ne 'success') { exit 1 }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr35-transition-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/newsflow-transition-evidence/tests.xml
            ${{ runner.temp }}/newsflow-transition-evidence/bat.json
            ${{ runner.temp }}/newsflow-transition-evidence/outcomes.json
          retention-days: 14
          if-no-files-found: warn
