name: NewsFlow rebuilt core studios focused Windows verification
on:
  push:
    branches: [codex/newsflow-core-studios-rebuild-20261027]
    paths:
      - 'newsflow-ai/frontend/**'
      - 'newsflow-ai/src/newsflow/studio/**'
      - 'newsflow-ai/tools/studio_v3/tests/test_core_context.py'
      - 'newsflow-ai/tools/studio_v3/integration/test_core_context_integration.py'
      - '.github/workflows/newsflow-core-studios.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Pinned frontend build
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install isolated test dependencies
        run: python -m pip install -e . pytest==8.4.2 httpx==0.28.1
      - name: Read-only core context and existing projection contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -p no:cacheprovider --confcutdir tools/studio_v3/tests --junitxml=core-readmodel.xml tools/studio_v3/tests
      - name: New GET route integration in approved synthetic Windows procedure
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q -p no:cacheprovider --confcutdir tools/studio_v3/integration --basetemp "$env:RUNNER_TEMP/core-studio-tests" --junitxml=core-integration.xml tools/studio_v3/integration/test_core_context_integration.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuilt-core-studios-focused
          path: |
            newsflow-ai/core-readmodel.xml
            newsflow-ai/core-integration.xml
