name: NewsFlow verification Guard copy and CRT boundary
on:
  push:
    branches: [codex/newsflow-core-studios-rebuild-20261027]
    paths:
      - 'newsflow-ai/tools/native_guard_copy/**'
      - '.github/workflows/newsflow-native-guard-copy.yml'
permissions:
  contents: read
jobs:
  copy-capability-and-CRT-security:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install unchanged filelock for source and post-Guard rejection probe
        run: python -m pip install --disable-pip-version-check --no-deps filelock==3.32.7
      - name: Verification Guard copy and owned CRT/path-buffer tests only
        run: python -I -B newsflow-ai/tools/native_guard_copy/run_copy_verification.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-guard-copy-CRT-evidence
          path: ${{ runner.temp }}/newsflow-guard-copy-*/copy-evidence.json
          if-no-files-found: error
