name: NewsFlow API Connection Windows

on:
  push:
    branches: [feat/newsflow-claude-api-connection]
    paths-ignore: ['newsflow-ai/docs/**']

permissions:
  contents: read

jobs:
  api-connection-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONUTF8: '1'
      NEWSFLOW_DATA_DIR: ${{ runner.temp }}/newsflow-api-connection-${{ matrix.python }}
      NEWSFLOW_LIVE_TEST: '0'
      NEWSFLOW_AI_LIVE_TEST: '0'
      NEWSFLOW_AI_API_KEY: ''
      NEWSFLOW_CLAUDE_API_KEY: ''
      NEWSFLOW_ANTHROPIC_API_KEY: ''
      NEWSFLOW_VIDEO_AI_KEY: ''
      NEWSFLOW_ELEVENLABS_KEY: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      CLAUDE_CODE_OAUTH_TOKEN: ''
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned dependencies and pip check
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install -r requirements-dev.lock -r tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ruff - changed Python files and targeted tests
        run: |
          .venv/Scripts/python -m ruff check src/newsflow/gui/api_settings_routes.py src/newsflow/gui/production_routes.py src/newsflow/gui/production_status.py src/newsflow/intelligence/api_connection.py src/newsflow/intelligence/api_providers.py src/newsflow/intelligence/api_settings.py src/newsflow/intelligence/settings.py tests/test_api_connection.py tests/test_claude_connection_gui.py tests/test_api_model_choices.py tests/test_elevenlabs_settings_links.py tests/test_api_settings.py tests/test_model_picker_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fake API connection, consent, models, keys and budget contracts
        run: |
          .venv/Scripts/python -m pytest -q -rs tests/test_api_connection.py tests/test_claude_connection_gui.py tests/test_api_model_choices.py tests/test_elevenlabs_settings_links.py tests/test_api_settings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline Chrome model picker - existing runner Chrome
        run: |
          .venv/Scripts/python -m pytest -q -rs tests/test_model_picker_browser.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Synthetic keys, temporary databases and injected transports only. The
      # browser tests use about:blank and abort all network requests. No vendor
      # API, Claude Code/Codex CLI, live news, video, OS registration or uploads.
