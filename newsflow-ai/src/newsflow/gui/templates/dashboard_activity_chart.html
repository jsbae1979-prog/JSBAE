      <section class="dash-panel dash-activity" id="production-activity" aria-labelledby="activity-title"><div class="dash-panel-heading"><h2 id="activity-title">제작 활동</h2><span>최근 7일 · KST</span></div><div class="dash-chart-legend"><span class="video">생성 완료 기록</span><span class="news">수집 기사</span><output id="chart-readout" aria-live="polite"></output></div>
        <svg class="dash-chart" viewBox="0 0 540 132" role="img" aria-label="최근 7일 실제 뉴스 수집·영상 생성 완료 기록"><defs><linearGradient id="dash-chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2585ff" stop-opacity=".28"/><stop offset="100%" stop-color="#2585ff" stop-opacity="0"/></linearGradient></defs>{% for y in [12,62,112] %}<path class="chart-grid" d="M20 {{ y }}H500"/>{% endfor %}<polygon points="20,112 {{ dashboard.video_points }} 500,112" fill="url(#dash-chart-fill)"/><polyline class="chart-video" points="{{ dashboard.video_points }}"/><polyline class="chart-news" points="{{ dashboard.news_points }}"/>{% for day in dashboard.days %}<circle class="chart-video-dot" cx="{{ day.x }}" cy="{{ day.video_y }}" r="3"/><circle class="chart-news-dot" cx="{{ day.x }}" cy="{{ day.news_y }}" r="3"/>{% endfor %}<text x="515" y="16">{{ dashboard.maximum }}</text><text x="515" y="116">0</text></svg>
        <div class="dash-chart-days">{% for day in dashboard.days %}<button type="button" data-chart-day data-description="{{ day.date }} · 수집 {{ day.news }}건 · 생성 완료 {{ day.videos }}건" aria-label="{{ day.date }}: 수집 {{ day.news }}건, 생성 완료 {{ day.videos }}건">{{ day.label }}</button>{% endfor %}</div>
        <p class="dash-chart-note">{{ '아직 집계된 활동이 없어요.' if not dashboard.has_activity else '저장된 수집·완료 시각 기준' }}{% if dashboard.unknown_finished %} · 완료시각 없는 {{ dashboard.unknown_finished }}건 제외{% endif %}</p>
      </section>
