name: Step13H Windows Fake images
on:
  push:
    branches: [codex/newsflow-step13h-20261025]
    paths: ['newsflow-ai/src/**', 'newsflow-ai/tests/**', 'newsflow-ai/tools/validation/step13h/**', '.github/workflows/newsflow-step13h-windows.yml']
permissions:
  contents: read
jobs:
  fake-images:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Test dependencies only
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'newsflow-314'
          python -m venv $venv
          & "$venv/Scripts/python.exe" -m pip install -r requirements-dev.lock playwright==1.64.1 colorama tzdata==2026.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH += ';C:/ProgramData/chocolatey/bin;C:/tools/ffmpeg/bin'
          }
          "NEWSFLOW_FFMPEG=$((Get-Command ffmpeg -ErrorAction Stop).Source)" >> $env:GITHUB_ENV
          "NEWSFLOW_FFPROBE=$((Get-Command ffprobe -ErrorAction Stop).Source)" >> $env:GITHUB_ENV
          "NEWSFLOW_TEST_BROWSER_EXECUTABLE=C:/Program Files/Google/Chrome/Application/chrome.exe" >> $env:GITHUB_ENV
      - name: Guarded synthetic images, Chrome and real FFmpeg MP4
        run: |
          $python = Join-Path $env:RUNNER_TEMP 'newsflow-314/Scripts/python.exe'
          & $python -I -B tools/validation/step13h/prepare_windows.py (Join-Path $env:RUNNER_TEMP 'newsflow-step13h')
          exit $LASTEXITCODE
      - name: Publish only scoped synthetic screenshots and pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step13h-synthetic-evidence
          path: |
            ${{ runner.temp }}/newsflow-step13h/h/evidence/news-images-*.png
            ${{ runner.temp }}/newsflow-step13h/h/evidence/news-image-mp4/pixel-proof.json
            ${{ runner.temp }}/newsflow-step13h/*-supervisor-safe.json
          if-no-files-found: ignore
          retention-days: 14
