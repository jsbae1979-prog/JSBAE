name: NewsFlow PR35 Script Flow Diagnosis Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  script-flow:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONUTF8: '1'
      NEWSFLOW_LIVE_TEST: '0'
      NEWSFLOW_AI_LIVE_TEST: '0'
      NEWSFLOW_AI_API_KEY: ''
      NEWSFLOW_CLAUDE_API_KEY: ''
      NEWSFLOW_ANTHROPIC_API_KEY: ''
      NEWSFLOW_VIDEO_AI_KEY: ''
      NEWSFLOW_ELEVENLABS_KEY: ''
      NEWSFLOW_META_APP_SECRET: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      CLAUDE_CODE_OAUTH_TOKEN: ''
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned dependencies and pip check
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install -r requirements-dev.lock -r tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare existing video and Chrome prerequisites
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:PATH += ';C:\ProgramData\chocolatey\bin;C:\tools\ffmpeg\bin'
          }
          @((Split-Path (Get-Command ffmpeg -ErrorAction Stop).Source), (Split-Path (Get-Command ffprobe -ErrorAction Stop).Source)) | Select-Object -Unique | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $fontPath = 'C:\Windows\Fonts\malgun.ttf'
          if (-not (Test-Path -LiteralPath $fontPath)) { throw 'Korean font missing' }
          "NEWSFLOW_FONT_PATH=$fontPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEWSFLOW_VALIDATION_OUTPUT=$env:RUNNER_TEMP/newsflow-final-ui" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NEWSFLOW_DATA_DIR=$env:RUNNER_TEMP/newsflow-final-ui-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $chrome = @("$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe")
          if (-not ($chrome | Where-Object { Test-Path -LiteralPath $_ })) { throw 'Windows Chrome missing' }
      - name: Isolate native profile and record exact product version
        run: |
          "LOCALAPPDATA=$env:RUNNER_TEMP/newsflow-final-ui-profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$PWD/src;$PWD/tests;$PWD/tools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/newsflow-final-ui" | Out-Null
          git rev-parse HEAD
          python --version
      - name: Ruff validation tools
        run: .venv/Scripts/python -m ruff check tools/ci_script_flow_recheck.py tools/flow_failure_diagnostics.py tools/flow_script_fixture.py tools/test_windows_final_flow.py tools/test_mobile_voice_access.py
      - name: Compare old and corrected Fake flow on both product revisions
        id: flow
        continue-on-error: true
        run: .venv/Scripts/python tools/ci_script_flow_recheck.py --output "$env:RUNNER_TEMP/newsflow-script-flow"
      - name: Existing safety regressions and actual mobile activation
        id: safety
        if: always()
        continue-on-error: true
        run: |
          $env:NEWSFLOW_VALIDATION_OUTPUT = "$env:RUNNER_TEMP/newsflow-script-flow/safety"
          .venv/Scripts/python -m pytest -q -rs -p windows_final_guard tests/test_narration_length_contract.py tests/test_explainer_review_safety.py tests/test_api_news_pipeline.py tools/test_mobile_voice_access.py --junitxml="$env:RUNNER_TEMP/newsflow-script-flow/safety.xml"
          exit $LASTEXITCODE
      - name: Preserve real outcomes
        if: always()
        run: |
          $results = @{ flow='${{ steps.flow.outcome }}'; safety='${{ steps.safety.outcome }}'; sha='${{ github.sha }}'; python='${{ matrix.python }}' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/newsflow-script-flow" | Out-Null
          $results | ConvertTo-Json | Out-File "$env:RUNNER_TEMP/newsflow-script-flow/outcomes.json" -Encoding utf8
          if (@($results.flow,$results.safety) | Where-Object { $_ -ne 'success' }) { exit 1 }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr35-script-flow-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/newsflow-script-flow/**/*.json
            ${{ runner.temp }}/newsflow-script-flow/**/*.xml
            ${{ runner.temp }}/newsflow-script-flow/**/*.txt
            ${{ runner.temp }}/newsflow-script-flow/**/*.png
            ${{ runner.temp }}/newsflow-script-flow/**/synthetic-review.mp4
          retention-days: 14
          if-no-files-found: warn
