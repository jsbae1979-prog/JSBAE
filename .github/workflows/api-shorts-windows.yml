name: NewsFlow API Shorts Windows

on:
  push:
    branches: [codex/newsflow-api-shorts-pipeline]
    paths-ignore: ['newsflow-ai/docs/**']

permissions:
  contents: read

jobs:
  api-shorts-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONUTF8: '1'
      NEWSFLOW_LIVE_TEST: '0'
      NEWSFLOW_AI_LIVE_TEST: '0'
      NEWSFLOW_AI_API_KEY: ''
      NEWSFLOW_CLAUDE_API_KEY: ''
      NEWSFLOW_ANTHROPIC_API_KEY: ''
      NEWSFLOW_VIDEO_AI_KEY: ''
      NEWSFLOW_ELEVENLABS_KEY: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      CLAUDE_CODE_OAUTH_TOKEN: ''
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Isolated test data directory
        run: |
          "NEWSFLOW_DATA_DIR=$env:RUNNER_TEMP/newsflow-api-shorts-${{ matrix.python }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned dependencies and pip check
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install -r requirements-dev.lock -r tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ruff - changed Python files and local validation tool
        run: |
          .venv/Scripts/python -m ruff check src/newsflow/gui/intelligence_routes.py src/newsflow/gui/autopilot_routes.py src/newsflow/intelligence/news_usage.py src/newsflow/intelligence/service.py src/newsflow/intelligence/provider.py src/newsflow/intelligence/api_providers.py src/newsflow/autopilot/backend.py src/newsflow/autopilot/service.py src/newsflow/video/engine.py src/newsflow/video/service.py tests/test_api_shorts_intelligence.py tests/test_api_shorts_pipeline.py tests/test_api_shorts_audio.py tests/test_api_shorts_gui.py tests/test_api_news_pipeline.py tests/test_news_usage_pipeline.py tests/test_news_usage_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fake API stages, guarded editing and measured audio boundaries
        run: |
          .venv/Scripts/python -m pytest -q -rs tests/test_api_shorts_intelligence.py tests/test_api_shorts_pipeline.py tests/test_api_shorts_audio.py tests/test_api_shorts_gui.py tests/test_api_news_pipeline.py tests/test_news_usage_pipeline.py tests/test_news_usage_gui.py tests/test_topic_editor_gui.py tests/test_claude_audio_fit.py::test_timed_sapi_joins_actual_sentence_wavs tests/test_claude_audio_fit.py::test_overflow_reduces_whole_sentence_regenerates_and_moves_next_scene tests/test_claude_audio_fit.py::test_unshortenable_audio_fails_without_cutting tests/test_claude_audio_fit.py::test_ass_escapes_instruction_tags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Temporary databases, synthetic news and injected Fake transports only.
      # No live provider/CLI requests, real TTS or media validator execution,
      # live RSS, OS task registration, production data access or uploads.
