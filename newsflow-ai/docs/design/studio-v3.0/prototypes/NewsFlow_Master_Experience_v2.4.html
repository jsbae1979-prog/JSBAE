<section class="side-panel"><div class="panel-head"><h3>최근 활동</h3><span>전체 보기 ›</span></div><div class="activity-list">${[['activity_news','AI 반도체 시장 작업 예시','2시간 전'],['activity_char','캐릭터 쇼츠 프로젝트 예시','4시간 전'],['activity_image','이미지 카드 초안 예시','5시간 전']].map(([art,t,w])=>`<div class="activity"><img src="${img(art)}" alt=""><div><b>${t}</b><div class="when">${w} · 샘플</div></div></div>`).join('')}</div></section></div></div>`}
function createPage(){let choices=[['news','뉴스 쇼츠','기사 탐색부터 AI 대본·영상까지','feature_news','보관 뉴스·RSS','대본·음성·장면','9:16 쇼츠'],['character','캐릭터 쇼츠','캐릭터 스토리를 시각적인 장면으로','feature_character','캐릭터 PNG','AI 스토리보드','30초 장면 합성'],['image','이미지 게시물','AI 카드뉴스와 이미지 SNS 콘텐츠','feature_image','사진·뉴스 선택','AI 디자인','본문·출처 검토']];return `<div class="creator-wrap"><div class="left-column"><div class="creator-hero"><div class="small-label">CREATE WITH NEWSFLOW AI</div><h1>어떤 콘텐츠를 <span class="grad-text">만들까요?</span></h1><p>뉴스, 캐릭터 스토리, 이미지 게시물까지 — 아이디어를 선택하고 전문 작업실에서 바로 시작하세요.</p><span class="demo-tag" style="margin-top:14px">실제 생성·과금·게시 기능은 연결되지 않았습니다</span></div><div class="section-title"><h2>콘텐츠 유형 선택</h2><span class="subtle">3가지 전문 작업실</span></div><div class="creator-cards">${choices.map(([id,t,d,art,...tags],i)=>`<button class="choice-card ${i===1?'blue':i===2?'pink':''}" data-studio="${id}"><div class="choice-visual"><img src="${img(art)}" alt="${t} 디자인 참고 이미지"><span class="choice-number">0${i+1} · CREATOR</span></div><div class="choice-body"><h3>${t}</h3><p>${d}</p><div class="pillrow">${tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><div class="choice-bottom">작업실 열기 <span class="go">${I('next','sm')}</span></div></div></button>`).join('')}</div>
<div class="section-title"><h2>빠른 제작 템플릿</h2><button class="text-button" data-demo="템플릿은 디자인 시연용입니다.">더 보기 ${I('next','xs')}</button></div><div class="preset-grid">${[['news','file','30초 뉴스 브리핑','기사 → 대본 → 영상'],['news','video','60초 뉴스 심층','요약·자막·영상'],['character','bot','캐릭터 스토리','캐릭터 → 장면'],['image','image','SNS 뉴스 카드','뉴스 → 디자인']].map(([id,ic,t,d])=>`<button class="preset" data-studio="${id}">${I(ic)}<strong>${t}</strong><span>${d}</span></button>`).join('')}</div>
<div class="section-title"><h2>최근 작업 이어하기</h2><button class="text-button" data-route="library">라이브러리 ${I('next','xs')}</button></div><div class="project-grid">${projectCards(4)}</div></div>
<div class="right-column creator-side"><section class="side-panel"><div class="panel-head"><h3>쉽게 만드는 4단계</h3><span>제작 가이드</span></div><div class="steps-guide">${[['유형 선택','뉴스 쇼츠·캐릭터·이미지 중 선택'],['자료와 AI 설정','기존 작업물 또는 새 주제로 시작'],['장면·문구 편집','미리보기와 타임라인에서 수정'],['검토 후 완성','승인과 실제 게시 과정은 별도']].map(([t,d],i)=>`<div class="guide-step"><span class="num">${i+1}</span><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</div></section><section class="side-panel"><div class="panel-head"><h3>작업 안전 정책</h3></div><div class="notice">실제 앱에서는 서버가 허용한 행동만 실행합니다.<br>AI 생성 비용 동의, 대본 검토, 영상 합성 승인, 공개 게시는 각각 분리합니다.</div></section><section class="side-panel"><div class="panel-head"><h3>최근 프로젝트</h3></div><div class="activity-list">${projects.slice(0,3).map(p=>`<div class="activity"><img src="${img(p.img)}" alt=""><div><b>${p.title}</b><div class="when">${p.status} · 샘플</div></div></div>`).join('')}</div></section></div></div>`}
function editor(){
 const kind=state.kind, isNews=kind==='news',isChar=kind==='character',isImage=kind==='image';
 const title=kinds[kind];
 const editScenes=state.v24Edits||(state.v24Edits=sc.map(s=>({caption:s.caption,narration:s.nar,duration:s.duration})));
 const s=isNews?sc[state.scene]:characterScenes[state.scene];const edit=isNews?editScenes[state.scene]:null;
 const materials=['thumb_news','thumb_wind','thumb_tech','thumb_character'];
 const art=isImage?materials[state.asset]:isChar?s.img:s.img;
 const stepName=isImage?'이미지·문구 디자인':isChar?'스토리보드·장면 검토':'장면·대본 편집';
 const sceneCard=(item,i)=>`<button type="button" class="v24-scene ${state.scene===i?'active':''}" data-scene="${i}" aria-pressed="${state.scene===i}"><div class="v24-scene-art"><img src="${img(item.img)}" alt="샘플 ${item.title} 장면 이미지"/><span>0${i+1}</span></div><strong>${item.title}</strong><small>${isChar?'합성 샘플 · '+item.status:(editScenes[i].duration+'초 · 데모 장면')}</small></button>`;
 let source='';
 if(isNews){source=`<div class="v24-pane-heading"><div><span class="v24-eyebrow">SOURCE / SCRIPT</span><h2>기사 및 장면</h2></div><span class="v24-mini-status">예시 4장면</span></div><div class="v24-source-card"><img src="${img('thumb_news')}" alt="뉴스 기사 콘셉트 예시"/><div><span class="v24-eyebrow">샘플 기사 · 실제 뉴스 아님</span><strong>AI 반도체 시장의 주요 변화</strong><small>출처·저작권 검증: 미연결</small></div></div><div class="v24-pane-line"></div><span class="v24-panel-label">장면 선택 · 클릭하면 미리보기 연동</span><div class="v24-mini-scenes">${sc.map((x,i)=>`<button class="v24-mini-scene ${state.scene===i?'active':''}" data-scene="${i}" aria-pressed="${state.scene===i}"><img src="${img(x.img)}" alt="샘플 ${x.title}"><span><strong>${i+1}. ${x.title}</strong><small>${editScenes[i].duration}초 · ${editScenes[i].caption.slice(0,16)}</small></span></button>`).join('')}</div><div class="v24-note">뉴스 검색·원문·근거·권한 확인은 실제 Python 서비스와 연결한 뒤 표시합니다.</div>`;}
 else if(isChar){source=`<div class="v24-pane-heading"><div><span class="v24-eyebrow">CHARACTER / REFERENCE</span><h2>캐릭터와 장면</h2></div><span class="v24-mini-status">30초 목표</span></div><div class="v24-reference"><img src="${img('thumb_character')}" alt="합성 캐릭터 이미지 샘플"/><span>REFERENCE IMAGE · SAMPLE</span></div><div class="v24-panel-label">고정 캐릭터 · 예시 작품</div><strong class="v24-reference-title">느긋해 대리</strong><div class="v24-note">실제 참조 PNG 업로드·보존·전송은 기존 엔진에서 처리해야 합니다.</div><div class="v24-pane-line"></div><div class="v24-mini-scenes">${characterScenes.map((x,i)=>`<button class="v24-mini-scene ${state.scene===i?'active':''}" data-scene="${i}" aria-pressed="${state.scene===i}"><img src="${img(x.img)}" alt="샘플 ${x.title}"><span><strong>${i+1}. ${x.title}</strong><small>${x.status} · 데모 상태</small></span></button>`).join('')}</div>`;}
 else {source=`<div class="v24-pane-heading"><div><span class="v24-eyebrow">ASSET / DESIGN</span><h2>소재 라이브러리</h2></div><span class="v24-mini-status">샘플 4개</span></div><div class="v24-note">뉴스 이미지·내 사진·AI 디자인 결과를 이 영역에서 관리할 예정입니다.</div><span class="v24-panel-label">이미지 소재 선택</span><div class="v24-asset-grid">${materials.map((x,i)=>`<button class="v24-asset ${state.asset===i?'active':''}" data-asset="${i}" aria-pressed="${state.asset===i}"><img src="${img(x)}" alt="샘플 이미지 ${i+1}"><strong>샘플 소재 ${i+1}</strong></button>`).join('')}</div><div class="v24-pane-line"></div><div class="v24-tool-row"><span>${I('image','sm')} 이미지</span><span>${I('file','sm')} 문구</span><span>${I('layer','sm')} 레이어</span></div><div class="v24-note">Claude 카드 구성·OpenAI 이미지 생성·상위 3건 피드는 별도 동의와 실제 연결 필요.</div>`;}
 const captionText=isNews?edit.caption:isChar?characterScenes[state.scene].title:state.imageTitle;
 const preview=isImage?`<div class="v24-preview-bg"><div class="v24-image-canvas image-canvas ${state.imageRatio==='1:1'?'square':state.imageRatio==='9:16'?'tall':''}" id="imageCanvas"><img src="${img(art)}" alt="선택한 합성 이미지 소재"/><div class="v24-img-gradient"></div><div class="v24-image-label">NEWSFLOW · DESIGN DEMO</div><div class="image-copy v24-live-title" id="movableTitle" tabindex="0" style="top:${state.imageTitlePosition||48}%" aria-label="화살표 키 또는 드래그로 이미지 제목 위치 변경">${escapeHTML(state.imageTitle)}</div><div class="v24-image-desc" id="imageDescription">${escapeHTML(state.imageBody)}</div><div class="sourcetext">SAMPLE ONLY · 실제 출처 아님</div></div></div>`:`<div class="v24-preview-bg"><div class="v24-video-canvas video-canvas"><img src="${img(art)}" alt="${isChar?'캐릭터':'뉴스 쇼츠'} 장면 샘플"/><div class="v24-img-gradient"></div><span class="v24-preview-stamp">DESIGN SAMPLE · NOT AN MP4</span><div class="v24-preview-glyph">${I('play','lg')}</div><div class="v24-caption-band"><strong id="videoCaption">${escapeHTML(captionText)}</strong><small>장면 ${state.scene+1} / 4 · 실제 동영상 아님</small></div></div></div>`;
 const tools=isNews?`<div class="v24-pro-tabs" role="group" aria-label="편집 속성">${[['script','대본·자막'],['voice','음성'],['video','장면 소스']].map(([id,l])=>`<button type="button" class="${state.editorPanel===id?'active':''}" data-panel="${id}">${l}</button>`).join('')}</div>${state.editorPanel==='script'?`<div class="field"><label class="edit-label" for="cap">장면 자막</label><textarea id="cap" data-live="caption" rows="3">${escapeHTML(edit.caption)}</textarea></div><div class="field"><label class="edit-label" for="nar">내레이션</label><textarea id="nar" data-live="narration" rows="4">${escapeHTML(edit.narration)}</textarea></div><div class="field"><label class="edit-label" for="v24Duration">장면 길이 <b id="durationNumber">${edit.duration}초</b></label><input id="v24Duration" type="range" min="3" max="20" step="1" value="${edit.duration}" data-duration/></div>`:state.editorPanel==='voice'?`<div class="field"><span class="edit-label">음성 선택</span><div class="v24-pro-choice">${[['local','로컬 TTS'],['eleven','ElevenLabs']].map(([id,l])=>`<button class="${state.voice===id?'active':''}" data-voice="${id}">${l}</button>`).join('')}</div></div><div class="v24-note">실제 음성 목록·미리 듣기는 Windows 환경이나 연결된 음성 서비스에서 확인합니다. 유료 전송 승인은 별도입니다.</div>`:`<div class="field"><span class="edit-label">영상 제작 방식</span><div class="v24-pro-choice">${[['basic','FFmpeg 기본'],['ai','Higgsfield AI']].map(([id,l])=>`<button class="${state.mode===id?'active':''}" data-mode="${id}">${l}</button>`).join('')}</div></div><div class="v24-file-state"><span>${I('image','sm')} 현재 소재</span><strong>${s.title} · 예시 이미지</strong></div><div class="v24-note">AI 생성 견적·결과 불명·장면 검토는 서버의 실제 작업 상태에 따라 표시합니다.</div>`}`:
 isChar?`<div class="v24-pro-tabs" role="group" aria-label="캐릭터 작업 상태">${[['story','스토리'],['estimate','견적·승인'],['review','장면 검토']].map(([id,l])=>`<button class="${(state.charPanel||'story')===id?'active':''}" data-char-panel="${id}">${l}</button>`).join('')}</div>${(state.charPanel||'story')==='story'?`<div class="v24-file-state"><span>선택 장면</span><strong>${s.title}</strong></div><div class="field"><label class="edit-label">장면 설명</label><div class="v24-readonly">캐릭터의 행동·표정·장면 문구를 서버에서 읽어오는 영역입니다.</div></div>`:(state.charPanel==='estimate'?`<div class="v24-file-state"><span>공식 모델 견적</span><strong>— USD · 연결 필요</strong></div><div class="v24-steps"><span>참조 확인</span><span>모델·장면 확인</span><span>유료 생성 동의</span></div><div class="v24-note">계정·견적을 확인하기 전에는 유료 생성 버튼을 활성화하지 않습니다.</div>`:`<div class="v24-file-state"><span>서버 검증 결과</span><strong>실제 상태 미연결</strong></div><div class="v24-note">완료/실패/결과 불명 상태를 구분하고, 자동 재전송은 금지합니다.</div>`)}`:
 `<div class="v24-pro-tabs" role="group" aria-label="이미지 디자인 속성">${[['copy','문구'],['canvas','캔버스'],['rights','검토']].map(([id,l])=>`<button class="${(state.imagePanel||'copy')===id?'active':''}" data-image-panel="${id}">${l}</button>`).join('')}</div>${(state.imagePanel||'copy')==='copy'?`<div class="field"><label class="edit-label" for="imageTitle">이미지 제목</label><textarea id="imageTitle" data-live="imageTitle" rows="3">${escapeHTML(state.imageTitle)}</textarea></div><div class="field"><label class="edit-label" for="imageBody">이미지 설명</label><textarea id="imageBody" data-live="imageBody" rows="4">${escapeHTML(state.imageBody)}</textarea></div><div class="v24-note">제목을 캔버스에서 드래그하거나 키보드 화살표로 이동할 수 있습니다.</div>`:state.imagePanel==='canvas'?`<div class="field"><span class="edit-label">이미지 비율</span><div class="v24-pro-choice">${['1:1','4:5','9:16'].map(id=>`<button class="${state.imageRatio===id?'active':''}" data-ratio="${id}">${id}</button>`).join('')}</div></div><div class="v24-file-state"><span>현재 선택</span><strong>샘플 소재 ${state.asset+1}</strong></div><div class="v24-note">자유 레이어 추가·크기 변경·파일 저장은 실제 제품의 신규 구현 범위입니다.</div>`:`<div class="v24-steps"><span>출처 확인</span><span>이미지 사용 권한</span><span>AI 표시 검토</span><span>게시 승인</span></div><div class="v24-note">완성 이미지는 원본 파일과 SHA를 보존하고, 수정 시 새 버전으로 저장합니다.</div>`}`;
 const timelineItems=isImage?materials.map((x,i)=>`<button class="v24-timeline-tile ${state.asset===i?'active':''}" data-asset="${i}" aria-pressed="${state.asset===i}"><img src="${img(x)}" alt="샘플 이미지 ${i+1}"/><span>소재 ${i+1}</span></button>`):(isChar?characterScenes:sc).map((x,i)=>`<button class="v24-timeline-tile ${state.scene===i?'active':''}" data-scene="${i}" aria-pressed="${state.scene===i}"><img src="${img(x.img)}" alt="샘플 장면 ${i+1}"/><span>${x.title}</span><small>${isChar?'장면 '+(i+1):editScenes[i].duration+'초'}</small></button>`).join('');

function businessAnalytics(){const t=state.businessAnalyticsTab;let label=t==='platform'?'플랫폼별 성과':t==='operations'?'제작·자동화 활동':'AI 사용량·비용';let kpis=t==='cost'?[['AI 사용량','—','공급사 확인 필요'],['예산 잔여','—','설정·사용 이력 미연결'],['확정 청구액','—','로컬 추정과 구분']]:t==='operations'?[['실행 작업','—','실제 작업 로그 미연결'],['완료 작업','—','검증된 실행 결과 필요'],['실패·복구','—','실제 오류 이력 미연결']]:[['조회수','—','공식 플랫폼 수집 필요'],['좋아요','—','미확인 값을 0으로 표시하지 않음'],['게시 수','—','실제 게시 이력 미연결']];return `<div class="biz-page">${bizHeader('INSIGHTS / REPORTING','성과 · 비용','조회수 · 제작 현황 · AI 사용량을 실제 근거와 함께 확인',bizBtn('데이터 수집 확인','data-demo="실제 외부 서비스 성과 조회는 연결되지 않았습니다."',true))}${bizSpotlight('INTELLIGENCE / PERFORMANCE','데이터가 들려주는, 다음 이야기.','조회수와 제작 기록·AI 비용을 같은 화면에서, 서로 다른 근거로 구분합니다.','thumb_tech','cyan')}${bizTabs([['platform','게시 성과'],['operations','제작 현황'],['cost','API 비용']],t,'data-analytics-tab')}<div class="biz-grid">${kpis.map(([a,b,c])=>`<div class="biz-kpi"><div class="klabel">${a}</div><div class="kvalue">${b}</div><div class="ksub">${c}</div></div>`).join('')}</div><div class="biz-two"><div class="biz-stack">${bizCard(label+' 변화',`<div class="biz-row space"><span class="biz-chip violet">시각적 그래프 예시</span><span class="biz-foot">실제 지표가 연결되면 교체</span></div>${bizLineChart()}<div class="biz-note">그래프의 선과 면적은 구성 참고용이며 실제 조회·성과·수익 데이터가 아닙니다.</div>`)}${bizCard('콘텐츠별 요약',`<div class="biz-gallery">${['thumb_news','thumb_character','thumb_wind','thumb_tech'].map((i,n)=>`<div class="biz-asset"><img src="${img(i)}" alt="예시 결과"><strong>${['AI 산업 쇼츠','캐릭터 쇼츠','에너지 브리핑','기술 카드'][n]}</strong><small>수치 미수집</small></div>`).join('')}</div>`)}</div>${bizCard('분석 데이터 기준',`<div class="biz-stack"><div class="biz-icon-tile">${I('chart')}</div>${['실제 공급사 연결 상태 확인','성공/실패/결과 불명 분리','예시/합성 기록과 운영 기록 구분','예상 사용량·예약 비용·청구액 분리','성과 조회에 대한 사용자 동의'].map(x=>`<div class="biz-statusline">${I('check','sm')}<strong>${x}</strong></div>`).join('')}<div class="biz-note warn">확인되지 않은 수치는 0이나 증가율로 대신 표시하지 않습니다.</div></div>`)}</div></div>`}
function businessSettings(){let sec=businessSettingsData.find(x=>x[0]===state.businessSettingsTab)||businessSettings[0];let contents=sec[0]==='ai'?[['OpenAI API','키 상태 확인 필요'],['Claude API','키 상태 확인 필요'],['Codex CLI','설치·계정 환경 확인 필요']]:sec[0]==='voice'?[['Windows SAPI','운영 Windows 장치 필요'],['Supertonic 로컬 음성','모델·엔진 가용성 확인'],['ElevenLabs','별도 API 사용 승인']]:sec[0]==='video'?[['FFmpeg','설치 및 실제 생성 검증'],['Higgsfield','모델·계정·견적 확인'],['AI 장면 검토','장면별 수동 검토']]:sec[0]==='sns'?[['YouTube','계정·승인·권한 확인'],['Instagram','OAuth·게시 조건 확인'],['TikTok','앱 심사·계정 조건 확인'],['Facebook Page','Page 권한 확인']]:sec[0]==='cost'?[['월 API 예산','공급사 단가·한도 확인'],['사용 승인','모델·작업별 별도 동의'],['미확정 비용','실청구 확인 전 확정 금지']]:[['Windows 시작 옵션','OS 환경 검증 필요'],['사용자 로컬 데이터','%LOCALAPPDATA% 경계'],['오류·진단 보고','실제 운영 로그 검증 필요']];return `<div class="biz-page">${bizHeader('PREFERENCES / CONNECTIONS','설정 · 관리','AI · 음성 · 영상 · SNS · 비용 · Windows 운영 환경',bizBtn('초기 설정 마법사','data-route="setup"'))}${bizSpotlight('CONTROL YOUR CREATIVE TOOLKIT','창작 도구를, 하나의 작업실로.','모델·음성·영상·SNS 서비스를 확인하고 사용 한도와 보안 설정을 관리합니다.','hero_globe','blue')}<div class="biz-three"><section class="biz-card pad"><div class="biz-card-h"><h2>설정 분야</h2><span class="biz-chip violet">6개</span></div><div class="biz-settings-list">${businessSettingsData.map(([id,t,d])=>`<button class="${id===state.businessSettingsTab?'active':''}" data-settings-tab="${id}">${I(id==='ai'?'spark':id==='voice'?'play':id==='video'?'video':id==='sns'?'send':id==='cost'?'chart':'settings','sm')}<div><strong>${t}</strong><small style="display:block;opacity:.78;margin-top:4px">${d}</small></div></button>`).join('')}</div></section>${bizCard(sec[1],`<div class="biz-stack">${contents.map(([a,b])=>`<div class="biz-readiness"><div class="biz-icon-tile">${I(sec[0]==='voice'?'play':sec[0]==='sns'?'send':'settings')}</div><div class="grow"><strong>${a}</strong><p class="biz-muted">${b}</p></div><span class="badge">미검증</span></div>`).join('')}<div class="biz-note">설정 화면에서는 값 저장과 연결 검사, 유료 요청 실행을 엄격하게 구분합니다.</div>${bizBtn('설정 동작 확인','data-demo="현재 UI 시안은 실제 설정값을 저장하거나 키를 전송하지 않습니다."',true)}</div>`,'<span class="biz-chip warn">상태 미확인</span>')}${bizCard('보안·진단 원칙',`<div class="biz-stack">${['비밀 키는 화면·일반 저장소에 노출 금지','연결 성공은 실제 검사 결과가 있을 때만','유료 생성은 요청마다 명시 승인','Windows 사용자별 데이터 경계 보존','CSP·Origin·CSRF 보호 유지'].map(x=>`<div class="biz-statusline">${I('check','sm')}<strong>${x}</strong></div>`).join('')}<div class="biz-note warn">실제 계정 연결 표시와 가상의 활성화 토글은 제공하지 않습니다.</div></div>`)}</div></div>`}
function businessSetup(){const steps=[['시작 안내','Windows 앱 준비와 사용자 데이터 위치를 확인합니다.'],['환경 점검','로컬 Python·FFmpeg·브라우저·한글 폰트의 준비 상태를 확인합니다.'],['AI 모델','뉴스 분석·대본 모델과 인증 방식을 선택합니다.'],['음성 설정','한국어 음성, 속도, 쉼을 확인합니다.'],['영상 설정','FFmpeg와 선택적 AI 영상 엔진의 준비 상태를 검증합니다.'],['SNS 계정','각 플랫폼의 권한·공개 정책을 확인합니다.'],['완료 검토','사용자가 모든 항목을 확인한 후에만 설정 완료로 저장합니다.']];const cur=steps[state.businessSetupStep];return `<div class="biz-page">${bizHeader('WELCOME / FIRST RUN','처음 실행 · 설정 마법사','사용자 Windows 환경에서 안전하게 서비스를 준비',bizBtn('설정 화면으로','data-route="settings"'))}<div class="biz-hero"><img class="visual" src="${img('hero_globe')}" alt=""/><div><span class="small-label">WELCOME TO NEWSFLOW</span><h2>당신의 AI 콘텐츠 제작실을<br><span class="grad-text">차근차근 준비하세요.</span></h2><p>실제 설치 상태와 외부 서비스 연결은 Windows에서 확인합니다.</p></div></div><div class="biz-two">${bizCard('설정 순서',`<div class="biz-stack">${steps.map(([title,desc],i)=>`<button type="button" class="biz-shortcut" style="${i===state.businessSetupStep?'border-color:#9c88ff;background:#302e68':''}" data-setup-step="${i}"><span class="biz-icon-tile">${i+1}</span><div><strong>${title}</strong><small>${desc}</small></div></button>`).join('')}</div>`)}${bizCard(`STEP ${state.businessSetupStep+1} / 7`,`<div class="biz-stack"><div class="biz-icon-tile">${I('wand','lg')}</div><h2 style="font-size:24px">${cur[0]}</h2><p class="biz-muted">${cur[1]}</p><div class="biz-setup-progress">${steps.map((_,i)=>`<span class="${i<=state.businessSetupStep?'active':''}"></span>`).join('')}</div><div class="biz-note warn">데모 진행 단계일 뿐, 실제 준비 검사나 설정 저장은 실행되지 않았습니다.</div><div class="biz-row wrap">${bizBtn('이전',`data-setup-step="${Math.max(0,state.businessSetupStep-1)}"`)}${state.businessSetupStep===6?bizBtn('실제 완료 저장 미연결','data-demo="설정 완료 저장은 실제 백엔드 연동 후 가능합니다."',true):bizBtn('다음 단계',`data-setup-step="${state.businessSetupStep+1}"`,true)}</div></div>`,'<span class="biz-chip">시뮬레이션</span>')}</div></div>`}
function businessPage(route){if(route==='news')return businessNews();if(route==='automation')return businessAutomation();if(route==='library')return businessLibrary();if(route==='publishing')return businessPublishing();if(route==='analytics')return businessAnalytics();if(route==='settings')return businessSettings();if(route==='setup')return businessSetup();return bizHeader('UNKNOWN','화면을 찾을 수 없습니다','홈으로 돌아가세요',bizBtn('홈','data-route="dashboard"'));}

function placeholder(id){return businessPage(id)}
function render(){document.getElementById('nav').innerHTML=navMarkup();const r=state.route;const el=document.getElementById('screen');el.innerHTML=r==='dashboard'?dashboard():r==='create'?createPage():r.startsWith('studio/')?editor():placeholder(r);document.title=`NewsFlow AI Studio | ${r==='dashboard'?'홈':r==='create'?'콘텐츠 제작':r.startsWith('studio/')?kinds[state.kind]:r} · 디자인 시안`;document.querySelectorAll('[data-live],[data-business-input]').forEach(e=>e.addEventListener('input',liveInput));document.querySelectorAll('[data-pub-check]').forEach(e=>e.addEventListener('change',ev=>{let n=+ev.target.dataset.pubCheck;if(ev.target.checked){state.businessPublishChecks=[...new Set([...state.businessPublishChecks,n])]}else{state.businessPublishChecks=state.businessPublishChecks.filter(i=>i!==n)}render()}));document.getElementById('searchInput').value='';if(r.startsWith('studio/'))installDrag();}
function toast(message){let el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toast._timer);toast._timer=setTimeout(()=>el.classList.remove('visible'),2700)}
function navigate(r){location.hash='#/'+r;state.route=r;render();window.scrollTo(0,0)}
function goStudio(k){state.kind=k;state.scene=0;state.editorPanel='script';state.charPanel='story';state.imagePanel='copy';state.caption=sc[0].caption;state.narration=sc[0].nar;navigate('studio/'+k)}
function liveInput(e){if(e.target.dataset.businessInput){const field=e.target.dataset.businessInput;state[field]=e.target.value;if(field==='businessQuery'){const q=String(state.businessQuery||'').toLowerCase().trim();const matches=businessArticles.map((a,i)=>({...a,i})).filter(a=>(state.businessCategory==='all'||a.topic===state.businessCategory)&&(!q||a.t.toLowerCase().includes(q)||a.tags.join(' ').toLowerCase().includes(q)));const host=document.getElementById('bizArticleList');if(host)host.innerHTML=matches.length?matches.map(a=>newsStory(a,a.i)).join(''):'<div class="biz-blank"><strong>샘플 검색 결과 없음</strong></div>';const count=document.getElementById('bizNewsCount');if(count)count.textContent='예시 '+matches.length+'건';}return;}let field=e.target.dataset.live;state[field]=e.target.value;if(field==='caption'||field==='narration'){if(!state.v24Edits)state.v24Edits=sc.map(s=>({caption:s.caption,narration:s.nar,duration:s.duration}));state.v24Edits[state.scene][field]=e.target.value;}if(field==='caption'){const cap=document.getElementById('videoCaption');if(cap)cap.textContent=e.target.value;}if(field==='imageTitle'){let el=document.getElementById('movableTitle');if(el)el.textContent=e.target.value;}if(field==='imageBody'){let el=document.getElementById('imageDescription');if(el)el.textContent=e.target.value;}}
function installDrag(){let el=document.getElementById('movableTitle');if(!el)return;let drag=null;el.addEventListener('pointerdown',e=>{drag={y:e.clientY,top:parseFloat(el.style.top||'48')};el.setPointerCapture(e.pointerId);el.classList.add('dragging');e.preventDefault()});el.addEventListener('pointermove',e=>{if(!drag)return;const box=document.getElementById('imageCanvas');let v=drag.top+100*(e.clientY-drag.y)/box.clientHeight;state.imageTitlePosition=Math.max(9,Math.min(81,v));el.style.top=state.imageTitlePosition+'%';});el.addEventListener('pointerup',()=>{drag=null;el.classList.remove('dragging')});el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();let v=parseFloat(el.style.top||'48')+(e.key==='ArrowUp'?-2:2);el.style.top=Math.max(9,Math.min(81,v))+'%'}})}
document.addEventListener('click',e=>{let x=e.target.closest('[data-route],[data-studio],[data-project],[data-scene],[data-asset],[data-panel],[data-voice],[data-mode],[data-ratio],[data-demo],[data-news-tab],[data-news-category],[data-news-select],[data-auto-tab],[data-auto-select],[data-lib-filter],[data-lib-select],[data-pub-platform],[data-analytics-tab],[data-settings-tab],[data-setup-step],[data-char-panel],[data-image-panel]');if(!x)return;if(x.dataset.route){navigate(x.dataset.route)}else if(x.dataset.studio){goStudio(x.dataset.studio)}else if(x.dataset.project!==undefined){goStudio(projects[+x.dataset.project].type)}else if(x.dataset.scene!==undefined){state.scene=+x.dataset.scene;state.caption=(state.v24Edits?.[state.scene]?.caption||sc[state.scene]?.caption||state.caption);state.narration=(state.v24Edits?.[state.scene]?.narration||sc[state.scene]?.nar||state.narration);render()}else if(x.dataset.asset!==undefined){state.asset=+x.dataset.asset;render()}else if(x.dataset.panel){state.editorPanel=x.dataset.panel;render()}else if(x.dataset.charPanel){state.charPanel=x.dataset.charPanel;render()}else if(x.dataset.imagePanel){state.imagePanel=x.dataset.imagePanel;render()}else if(x.dataset.voice){state.voice=x.dataset.voice;render()}else if(x.dataset.mode){state.mode=x.dataset.mode;render()}else if(x.dataset.ratio){state.imageRatio=x.dataset.ratio;render()}else if(x.dataset.newsTab){state.businessTab=x.dataset.newsTab;render()}else if(x.dataset.newsCategory){state.businessCategory=x.dataset.newsCategory;render()}else if(x.dataset.newsSelect!==undefined){state.businessNewsSelected=+x.dataset.newsSelect;render()}else if(x.dataset.autoTab){state.businessAutoTab=x.dataset.autoTab;render()}else if(x.dataset.autoSelect!==undefined){state.businessAutoSelected=+x.dataset.autoSelect;render()}else if(x.dataset.libFilter){state.businessLibFilter=x.dataset.libFilter;if(state.businessLibFilter!=='all'&&businessLibraryData[state.businessLibSelected].kind!==state.businessLibFilter){state.businessLibSelected=Math.max(0,businessLibraryData.findIndex(a=>a.kind===state.businessLibFilter))}render()}else if(x.dataset.libSelect!==undefined){state.businessLibSelected=+x.dataset.libSelect;render()}else if(x.dataset.pubPlatform){state.businessPlatform=x.dataset.pubPlatform;render()}else if(x.dataset.analyticsTab){state.businessAnalyticsTab=x.dataset.analyticsTab;render()}else if(x.dataset.settingsTab){state.businessSettingsTab=x.dataset.settingsTab;render()}else if(x.dataset.setupStep!==undefined){state.businessSetupStep=+x.dataset.setupStep;render()}else if(x.dataset.demo){toast(x.dataset.demo)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-duration]')){if(!state.v24Edits)state.v24Edits=sc.map(s=>({caption:s.caption,narration:s.nar,duration:s.duration}));state.v24Edits[state.scene].duration=Number(e.target.value);render();}});
window.addEventListener('hashchange',()=>{let v=location.hash.replace(/^#\/?/,'')||'dashboard';state.route=v;if(v.startsWith('studio/'))state.kind=v.split('/')[1]||'news';render();window.scrollTo(0,0)});window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('searchInput').focus()}});document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();if(!q)return;let item=projects.findIndex(p=>p.title.toLowerCase().includes(q));if(item>=0)goStudio(projects[item].type);else toast('샘플 목록에서 검색 결과가 없습니다. 실제 검색 API는 아직 연결되지 않았습니다.')}});let v=location.hash.replace(/^#\/?/,'')||'dashboard';state.route=v;if(v.startsWith('studio/'))state.kind=v.split('/')[1]||'news';render();
})();
</script>
</body></html>
