name: Real Windows users and final private release evidence
on:
  push:
    branches: [codex/newsflow-release-evidence-final-20261028]
    paths:
      - 'newsflow-ai/tools/distribution_final/**'
      - '.github/workflows/newsflow-release-final-evidence.yml'
permissions:
  contents: read
jobs:
  real-standard-users:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.7'
      - name: Install only probe runtime in disposable CI
        run: |
          python -m pip install SQLAlchemy==2.1.4 uvicorn==0.54.0 pywin32==312
          exit $LASTEXITCODE
      - name: Two actual synthetic standard users; no operating PC account
        run: |
          ./tools/distribution_final/real_users_ci.ps1 -Workspace (Join-Path $env:RUNNER_TEMP 'newsflow-real-users')
      - name: Nonsecret evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-standard-user-evidence
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/newsflow-real-users/real-user-results.json
            ${{ runner.temp }}/newsflow-real-users/cleanup-results.json
