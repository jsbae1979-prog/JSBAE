name: NewsFlow Unified Publishing Windows

on:
  push:
    branches: [codex/newsflow-core-production]
    paths-ignore: ['newsflow-ai/docs/**']

permissions:
  contents: read

jobs:
  unified-publishing:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONUTF8: '1'
      NEWSFLOW_LIVE_TEST: '0'
      NEWSFLOW_AI_LIVE_TEST: '0'
      NEWSFLOW_AI_API_KEY: ''
      NEWSFLOW_CLAUDE_API_KEY: ''
      NEWSFLOW_ANTHROPIC_API_KEY: ''
      NEWSFLOW_VIDEO_AI_KEY: ''
      NEWSFLOW_ELEVENLABS_KEY: ''
      OPENAI_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      ANTHROPIC_AUTH_TOKEN: ''
      CLAUDE_CODE_OAUTH_TOKEN: ''
      NEWSFLOW_META_APP_SECRET: ''
    defaults:
      run:
        shell: pwsh
        working-directory: newsflow-ai
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Isolated test data
        run: |
          "NEWSFLOW_DATA_DIR=$env:RUNNER_TEMP/newsflow-unified-${{ matrix.python }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned dependencies and pip check
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install -r requirements-dev.lock -r tools/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ruff - C stage change scope
        run: |
          .venv/Scripts/python -m ruff check src/newsflow/main.py src/newsflow/gui/unified_publishing_routes.py src/newsflow/gui/instagram_routes.py src/newsflow/gui/production_routes.py src/newsflow/gui/autopilot_routes.py src/newsflow/oauth/instagram.py src/newsflow/oauth/instagram_relay.py src/newsflow/oauth/relay_server.py src/newsflow/publishing/unified.py tests/test_instagram_relay.py tests/test_instagram_relay_client.py tests/test_unified_publishing.py tests/test_unified_publishing_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: C stage Fake OAuth and unified publishing
        run: |
          .venv/Scripts/python -m pytest -q -rs tests/test_instagram_relay.py tests/test_instagram_relay_client.py tests/test_unified_publishing.py tests/test_unified_publishing_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Existing A/B suites are preserved, not rerun. New tests exercise existing
      # services through injected Fake transports, temporary DB and synthetic MP4.
      # No real login/upload/publication or operating application restart.
